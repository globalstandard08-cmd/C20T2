<script>
const STORAGE_KEY = 'RobotUmpires_Test_Reading';
const passageId = 'ielts-reading-passage3';

// --- Draggable Divider ---
const divider = document.getElementById('divider');
const passagePane = document.getElementById('passagePane');
const questionsPane = document.getElementById('questionsPane');
const MIN_WIDTH = 25, MAX_WIDTH = 75;
let savedSplit = localStorage.getItem(`${STORAGE_KEY}_split`);
let passagePercent = savedSplit ? parseFloat(savedSplit) : 50;

function applySplit() {
    passagePane.style.width = `calc(${passagePercent}% - 6px)`;
    questionsPane.style.width = `calc(${100 - passagePercent}% - 6px)`;
}
applySplit();

let isDraggingDivider = false;
divider.addEventListener('mousedown', e => {
    isDraggingDivider = true;
    divider.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
    if (!isDraggingDivider) return;
    const rect = document.getElementById('mainGrid').getBoundingClientRect();
    let newPercent = ((e.clientX - rect.left) / rect.width) * 100;
    newPercent = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, newPercent));
    passagePercent = newPercent;
    applySplit();
});
document.addEventListener('mouseup', () => {
    if (isDraggingDivider) {
        isDraggingDivider = false;
        divider.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        localStorage.setItem(`${STORAGE_KEY}_split`, passagePercent);
    }
});

// --- Highlight & Note System ---
const noteBox = document.getElementById('noteBox');
const noteText = document.getElementById('noteText');
const noteClose = document.getElementById('noteClose');
const contextMenu = document.getElementById('contextMenu');
let currentRange = null, activeHighlight = null;
const highlightAreas = ['passageArea', 'ynogArea', 'summaryArea', 'mcArea'];

function isInHighlightArea(node) {
    return highlightAreas.some(id => {
        const el = document.getElementById(id);
        return el && el.contains(node);
    });
}

function isSelectionValid(sel) {
    if (!sel || sel.isCollapsed || !sel.toString().trim()) return false;
    try {
        return isInHighlightArea(sel.getRangeAt(0).commonAncestorContainer);
    } catch { return false; }
}

function saveHighlightsData() {
    const highlights = [];
    document.querySelectorAll('.highlight').forEach(hl => {
        highlights.push({
            text: hl.textContent,
            note: hl.getAttribute('data-note') || ''
        });
    });
    localStorage.setItem(`${passageId}_highlights`, JSON.stringify(highlights));
}

document.addEventListener('contextmenu', e => {
    let el = e.target, clickedHighlight = null;
    while (el) {
        if (el.classList && el.classList.contains('highlight')) {
            clickedHighlight = el; break;
        }
        el = el.parentElement;
    }
    if (clickedHighlight) {
        activeHighlight = clickedHighlight;
        currentRange = null;
        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
        contextMenu.style.display = 'block';
        e.preventDefault();
        return;
    }
    const sel = window.getSelection();
    if (isSelectionValid(sel)) {
        currentRange = sel.getRangeAt(0).cloneRange();
        activeHighlight = null;
        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
        contextMenu.style.display = 'block';
        e.preventDefault();
    } else {
        contextMenu.style.display = 'none';
    }
});

document.addEventListener('click', e => {
    if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none';
});

document.getElementById('menuHighlight').addEventListener('click', () => {
    contextMenu.style.display = 'none';
    if (!currentRange) return;
    try {
        const span = document.createElement('span');
        span.className = 'highlight';
        span.setAttribute('data-note', '');
        currentRange.surroundContents(span);
        window.getSelection().removeAllRanges();
        saveHighlightsData();
    } catch { alert('⚠️ Please select smaller sections of text.'); }
});

document.getElementById('menuAddNote').addEventListener('click', () => {
    contextMenu.style.display = 'none';
    if (!activeHighlight && currentRange) {
        try {
            const span = document.createElement('span');
            span.className = 'highlight';
            span.setAttribute('data-note', '');
            currentRange.surroundContents(span);
            activeHighlight = span;
            window.getSelection().removeAllRanges();
        } catch { alert('⚠️ Please select smaller sections of text.'); return; }
    }
    if (!activeHighlight) return;
    const rect = activeHighlight.getBoundingClientRect();
    noteBox.style.left = Math.min(rect.right + 10, window.innerWidth - 280) + 'px';
    noteBox.style.top = Math.min(rect.top, window.innerHeight - 100) + 'px';
    noteBox.style.display = 'block';
    noteText.value = activeHighlight.getAttribute('data-note') || '';
    noteText.focus();
});

document.getElementById('menuRemove').addEventListener('click', () => {
    contextMenu.style.display = 'none';
    if (!activeHighlight) return;
    const parent = activeHighlight.parentNode;
    while (activeHighlight.firstChild) {
        parent.insertBefore(activeHighlight.firstChild, activeHighlight);
    }
    parent.removeChild(activeHighlight);
    parent.normalize();
    activeHighlight = null;
    saveHighlightsData();
});

noteClose.addEventListener('click', () => {
    if (activeHighlight) {
        activeHighlight.setAttribute('data-note', noteText.value);
        saveHighlightsData();
    }
    noteBox.style.display = 'none';
    activeHighlight = null;
});

// Drag note box
let isDraggingNote = false, noteOffsetX = 0, noteOffsetY = 0;
document.getElementById('noteDragHandle').addEventListener('mousedown', e => {
    isDraggingNote = true;
    const rect = noteBox.getBoundingClientRect();
    noteOffsetX = e.clientX - rect.left;
    noteOffsetY = e.clientY - rect.top;
});
document.addEventListener('mousemove', e => {
    if (!isDraggingNote) return;
    let newX = e.clientX - noteOffsetX;
    let newY = e.clientY - noteOffsetY;
    newX = Math.max(0, Math.min(newX, window.innerWidth - 260));
    newY = Math.max(0, Math.min(newY, window.innerHeight - 80));
    noteBox.style.left = newX + 'px';
    noteBox.style.top = newY + 'px';
});
document.addEventListener('mouseup', () => isDraggingNote = false);

// --- Answers & Navigation ---
let currentQuestionNum = 27;

function setCurrentQuestion(qNum) {
    document.querySelectorAll('.q-row.current').forEach(r => r.classList.remove('current'));
    document.querySelectorAll('.q-indicator.current').forEach(b => b.classList.remove('current'));
    currentQuestionNum = qNum;
    const row = document.getElementById(`q${qNum}`);
    const indicator = document.querySelector(`.q-indicator[data-q="${qNum}"]`);
    if (row) row.classList.add('current');
    if (indicator) indicator.classList.add('current');
}

function updateStatus() {
    for (let q = 1; q <= 40; q++) {
        const btn = document.querySelector(`.q-indicator[data-q="${q}"]`);
        if (!btn) continue;
        let hasAnswer = false;
        
        if (q >= 27 && q <= 32) {
            hasAnswer = !!localStorage.getItem(`${STORAGE_KEY}_q${q}`);
        } else if (q >= 33 && q <= 37) {
            const val = localStorage.getItem(`${STORAGE_KEY}_q${q}`) || '';
            hasAnswer = val.trim().length > 0;
        } else if (q >= 38 && q <= 40) {
            hasAnswer = !!localStorage.getItem(`${STORAGE_KEY}_q${q}`);
        }
        
        btn.classList.toggle('answered', hasAnswer);
    }
}

document.querySelectorAll('.q-indicator').forEach(btn => {
    btn.addEventListener('click', () => {
        const qNum = parseInt(btn.dataset.q);
        setCurrentQuestion(qNum);
        const target = document.getElementById(`q${qNum}`);
        if (target) target.scrollIntoView({behavior:'smooth', block:'center'});
    });
});

// --- YES/NO/NOT GIVEN Handlers (Q27-32) ---
document.querySelectorAll('.ynog-label').forEach(label => {
    label.addEventListener('click', () => {
        const q = label.dataset.q;
        const val = label.dataset.val;
        document.querySelectorAll(`.ynog-label[data-q="${q}"]`).forEach(l => l.classList.remove('selected'));
        const current = localStorage.getItem(`${STORAGE_KEY}_q${q}`);
        if (current === val) {
            localStorage.removeItem(`${STORAGE_KEY}_q${q}`);
        } else {
            label.classList.add('selected');
            localStorage.setItem(`${STORAGE_KEY}_q${q}`, val);
        }
        updateStatus();
    });
});

// --- Summary Dropdown Handlers (Q33-37) ---
document.querySelectorAll('.summary-gap').forEach(select => {
    select.addEventListener('change', () => {
        const q = select.dataset.q;
        const val = select.value;
        if (val) {
            localStorage.setItem(`${STORAGE_KEY}_q${q}`, val);
        } else {
            localStorage.removeItem(`${STORAGE_KEY}_q${q}`);
        }
        updateStatus();
    });
});

// --- Multiple Choice Handlers (Q38-40) ---
document.querySelectorAll('.mc-radio').forEach(radio => {
    radio.addEventListener('change', () => {
        const q = radio.dataset.q;
        const val = radio.dataset.val;
        localStorage.setItem(`${STORAGE_KEY}_q${q}`, val);
        updateStatus();
    });
});

function clearAllData() {
    if (!confirm('⚠️ Are you sure you want to clear ALL answers, highlights, and notes? This cannot be undone.')) return;
    for (let q = 27; q <= 40; q++) localStorage.removeItem(`${STORAGE_KEY}_q${q}`);
    localStorage.removeItem(`${passageId}_highlights`);
    localStorage.removeItem(`${STORAGE_KEY}_split`);
    document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
    document.querySelectorAll('select.summary-gap').forEach(s => s.value = '');
    document.querySelectorAll('.ynog-label').forEach(l => l.classList.remove('selected'));
    document.querySelectorAll('.highlight').forEach(hl => {
        const parent = hl.parentNode;
        while (hl.firstChild) parent.insertBefore(hl.firstChild, hl);
        parent.removeChild(hl);
        parent.normalize();
    });
    location.reload();
}
document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

// Load saved data
document.addEventListener('DOMContentLoaded', () => {
    for (let q = 27; q <= 32; q++) {
        const saved = localStorage.getItem(`${STORAGE_KEY}_q${q}`);
        if (saved) {
            document.querySelectorAll(`.ynog-label[data-q="${q}"][data-val="${saved}"]`).forEach(l => l.classList.add('selected'));
        }
    }
    for (let q = 33; q <= 37; q++) {
        const select = document.getElementById(`ans${q}`);
        const saved = localStorage.getItem(`${STORAGE_KEY}_q${q}`) || '';
        if (saved) select.value = saved;
    }
    for (let q = 38; q <= 40; q++) {
        const saved = localStorage.getItem(`${STORAGE_KEY}_q${q}`);
        if (saved) {
            document.querySelector(`.mc-radio[data-q="${q}"][data-val="${saved}"]`).checked = true;
        }
    }
    setCurrentQuestion(27);
    updateStatus();
});
</script>
</body>
</html>
